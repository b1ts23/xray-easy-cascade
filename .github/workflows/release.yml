name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: |
          go test ./...
          go vet ./...
          sh -n install.sh
      - name: Build release binaries
        run: |
          ./scripts/build-release.sh "$GITHUB_REF_NAME" dist
          cp install.sh dist/install.sh
      - name: Publish or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag --latest
          fi
